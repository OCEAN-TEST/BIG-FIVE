<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>둘이서 분식집 · 영업 종료</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Black+Han+Sans&family=Jua&display=swap">
<style>
/* 예전 주소: 게임은 열지 않고 문 닫은 가게 간판만 보여줘요 */
:root {
  --wall: #2a201a;
  --wall-2: #33271f;
  --sign: #ffcf33;
  --chili: #d7372b;
  --paper: #fff8e6;
  --ink: #241a14;
  --soft: #74604f;
  --steel: #8d979d;
  --steel-2: #7b858b;
  --font-sign: "Black Han Sans", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  --font-ui: "Jua", "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
  color-scheme: dark;
}
* { box-sizing: border-box; }
html, body { margin: 0; min-height: 100%; }
body {
  min-height: 100vh; min-height: 100dvh;
  display: flex; align-items: center; justify-content: center;
  padding: 24px 16px;
  background: var(--wall);
  background-image: repeating-linear-gradient(0deg, var(--wall) 0 38px, var(--wall-2) 38px 40px), repeating-linear-gradient(90deg, transparent 0 78px, rgba(0,0,0,.18) 78px 80px);
  color: var(--ink);
  font-family: var(--font-ui);
}
main { width: min(560px, 100%); display: flex; flex-direction: column; align-items: center; }
.sign {
  width: 100%; background: var(--sign); border: 6px solid var(--chili); border-radius: 14px;
  box-shadow: 0 10px 0 rgba(0,0,0,.35); padding: 14px 16px; text-align: center; position: relative; z-index: 1;
}
.sign h1 { margin: 0; font-family: var(--font-sign); font-weight: 400; font-size: clamp(38px, 11vw, 64px); line-height: 1.1; color: var(--chili); letter-spacing: .02em; }
/* 내려진 셔터 */
.shutter {
  width: calc(100% - 28px); margin-top: -6px; padding: 30px 18px 26px;
  background: repeating-linear-gradient(180deg, var(--steel) 0 16px, var(--steel-2) 16px 18px);
  border-radius: 0 0 10px 10px; box-shadow: 0 10px 0 rgba(0,0,0,.35);
  display: flex; justify-content: center;
}
.note {
  background: var(--paper); border-radius: 6px; padding: 16px 22px 18px; text-align: center;
  transform: rotate(-2deg); box-shadow: 0 4px 0 rgba(0,0,0,.25); position: relative; max-width: 100%;
}
.note::before, .note::after { content: ""; position: absolute; top: -7px; width: 46px; height: 16px; background: rgba(255,255,255,.55); }
.note::before { left: 12px; transform: rotate(-8deg); }
.note::after { right: 12px; transform: rotate(7deg); }
.note b { display: block; font-size: clamp(26px, 7vw, 34px); font-weight: 400; color: var(--chili); line-height: 1.2; }
.note p { margin: 8px 0 0; font-size: 18px; color: var(--ink); line-height: 1.5; }
.note small { display: block; margin-top: 10px; font-size: 14px; color: var(--soft); }
</style>
</head>
<body>
<main>
  <header class="sign"><h1>둘이서 분식집</h1></header>
  <div class="shutter" role="status">
    <div class="note">
      <b>영업 종료</b>
      <p>이 주소의 분식집은 문을 닫았어요.</p>
      <small>그동안 찾아와 주셔서 고마워요.</small>
    </div>
  </div>
</main>
</body>
</html>
