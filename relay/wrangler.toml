# Cloudflare에 올릴 이름이에요. 대시보드에서 만드는 Worker 이름도 똑같이 bunsik-relay 로 해주세요.
name = "bunsik-relay"
main = "src/index.js"
compatibility_date = "2025-09-01"

[[durable_objects.bindings]]
name = "ROOMS"
class_name = "Room"

# 무료 플랜은 SQLite 방식 Durable Object만 돼요
[[migrations]]
tag = "v1"
new_sqlite_classes = ["Room"]
